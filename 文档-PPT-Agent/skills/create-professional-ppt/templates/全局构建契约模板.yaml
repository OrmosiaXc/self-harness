version: "1.0"
status: drafting
project:
  name: ""
  audience: ""
  scenario: ""
  build_mode: content-only-integration
  language: zh-CN

canvas:
  ratio: "16:9"
  width_in: 13.333
  height_in: 7.5
  safe_margin_in: 0.6

ownership:
  parent:
    - technical_outline
    - global_contract
    - page_title_map
    - titles
    - page_numbers
    - global_header_footer
    - integration
    - final_qa
  chapter:
    - chapter_sources
    - evidence_ledger
    - slide_content_lock
    - blueprints
    - editable_content
    - chapter_qa

zones:
  title_zone:
    enabled: true
    owner: parent
    x_in: 0.6
    y_in: 0.3
    w_in: 12.133
    h_in: 0.85
    chapter_objects_allowed: false
  content_zone:
    enabled: true
    owner: chapter
    x_in: 0.6
    y_in: 1.3
    w_in: 12.133
    h_in: 5.65
  footer_zone:
    enabled: false
    owner: parent
    x_in: 0.6
    y_in: 7.05
    w_in: 12.133
    h_in: 0.2
    chapter_objects_allowed: false

typography:
  chinese_font: ""
  latin_font: ""
  fallback_fonts: []
  title_pt: 30
  subtitle_pt: 18
  body_pt: 16
  annotation_pt: 11
  line_spacing: 1.15

colors:
  primary: ""
  secondary: ""
  accent: ""
  background: ""
  surface: ""
  text_primary: ""
  text_secondary: ""
  success: ""
  warning: ""
  danger: ""

geometry:
  grid_columns: 12
  gap_in: 0.18
  card_padding_in: 0.18
  card_radius_in: 0.08
  line_width_pt: 1.0
  shadow_policy: none

components:
  title: "由父任务集成，子章节不绘制"
  conclusion_card: ""
  process: ""
  architecture: ""
  matrix: ""
  table: ""
  chart: ""
  icon_style: ""

blueprint:
  engine: cyber-ppt
  required: true
  full_page_ratio: "16:9"
  preserve_reserved_zones: true
  approval_required: true
  content_lock_required: true
  component_signature_required: true

editable_build:
  engine: pptxgenjs
  native_objects_required: true
  full_page_raster_forbidden: true
  speaker_notes_required: true
  text_autofit_required: true
  stable_slide_ids_required: true

qa:
  require_structure_validation: true
  require_reserved_zone_validation: true
  require_full_render: true
  require_blueprint_comparison: true
  require_fix_and_reverify: true
  require_chapter_acceptance: true
  require_integration_regression: true

orchestration:
  parallel_chapters: false
  flat_tasks_only: true
  contract_owner: parent
  contract_version: "1.0"
  contract_hash: ""
  deviation_requires_parent_approval: true

forbidden:
  visible_titles_in_chapter_pages: true
  page_numbers_in_chapter_pages: true
  global_footer_in_chapter_pages: true
  placeholder_text: true
  unverified_metrics: true
  local_path_leaks: true

