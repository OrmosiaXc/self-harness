version: "1.0"
status: drafting
project:
  name: ""
  audience: ""
  scenario: ""
  build_mode: content-only-integration

canvas:
  ratio: "16:9"
  width_in: 13.333
  height_in: 7.5
  safe_margin_in: 0.6

zones:
  title_zone:
    enabled: true
    owner: parent
    x_in: 0.6
    y_in: 0.3
    w_in: 12.133
    h_in: 0.85
    chapter_objects_allowed: false
  content_zone:
    enabled: true
    owner: chapter
    x_in: 0.6
    y_in: 1.3
    w_in: 12.133
    h_in: 5.65
  footer_zone:
    enabled: false
    owner: parent
    x_in: 0.6
    y_in: 7.05
    w_in: 12.133
    h_in: 0.2
    chapter_objects_allowed: false

typography:
  chinese_font: ""
  latin_font: ""
  fallback_fonts: []
  title_pt: 30
  body_pt: 16
  annotation_pt: 11

colors:
  primary: ""
  secondary: ""
  accent: ""
  background: ""
  surface: ""
  text_primary: ""
  text_secondary: ""

blueprint:
  engine: cyber-ppt
  required: true
  approval_required: true
  content_lock_required: true
  component_signature_required: true

editable_build:
  engine: pptxgenjs
  native_objects_required: true
  full_page_raster_forbidden: true
  speaker_notes_required: true

orchestration:
  parallel_chapters: false
  flat_tasks_only: true
  contract_owner: parent
  contract_version: "1.0"
  contract_hash: ""

qa:
  require_reserved_zone_validation: true
  require_full_render: true
  require_blueprint_comparison: true
  require_fix_and_reverify: true
  require_integration_regression: true

