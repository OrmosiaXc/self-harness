name: "QA经验回流与分章修订"
prompt: "我提供了一份历史设计文档作为篇幅和图件参考。请先生成第三章单章预览，我会逐章修改；不要主动合并总文档。正式交付前要检查章节是不是只有一段概括，并确保参考项目名称和本机路径没有进入文档。"
assertions:
  - "参考文档保持只读并生成参考样本蒸馏规范"
  - "只采用标题密度、段落密度、表格和图件形式，不继承样本事实"
  - "可吸收当前项目材料中经验证的实际内容，但默认不把文件名、资料编号、本地路径和编写依赖说明写入正文"
  - "本地资源逻辑依赖说明只在用户明确要求后启用，且不自动允许本机绝对路径"
  - "生成第三章分章 Markdown/DOCX 预览且不合并总文档"
  - "final 检查阻止一节一段和重复套话"
  - "正式 Markdown、DOCX、元数据和图片替代文本不含本机路径和参考样本禁用词"
  - "修订范围外章节发生变化时阻止归档"
  - "图件检查覆盖重复标题、英文眉题、底部备注、连线穿块和字体可读性"
  - "编辑已有 Word 前执行占用、权限、保护属性和包结构预检"
