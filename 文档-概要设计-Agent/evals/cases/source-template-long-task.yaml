name: "源码、模板与长任务概要设计"
prompt: "合同、详细设计和模板都在外部材料目录，另有 Java 和 Python 源码。源码只分析不修改，成果输出到指定 resource 目录。生成技术类概要设计，不包含数据库详细设计、部署、运维和用户操作，并完成 Word 全页检查。"
assertions:
  - "登记外部资料和源码路径且标记只读"
  - "生成并更新源码与材料理解台账"
  - "建立合同功能追踪编码且不遗漏"
  - "蒸馏指定 Word 模板"
  - "需求分析包含功能需求和性能需求"
  - "系统总体设计包含原则、思路、架构、业务流程和数据流程"
  - "功能模块按七项结构展开"
  - "排除数据库详细设计、部署、运维和用户操作"
  - "正式 Markdown 和 DOCX 发布到指定成果目录"
  - "DOCX 全页渲染并确认逐页检查"
  - "长任务状态支持跨会话恢复"
